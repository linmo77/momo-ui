
<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✦ AI 酒馆 — Tavern</title>
<style>
/* ============================================
   0. CSS 变量 — AI 可一键修改的主题系统
   ============================================ */
:root {
  /* 主色调 */
  --primary:        #fdf0ec;
  --secondary:      #aee1f9;
  --primary-dark:   #f5d5cb;
  --secondary-dark: #7cc8f0;
  --accent:         #f8a4b8;
  --accent-alt:     #8fd4c8;

  /* 文字 */
  --text-primary:   #2c2c2e;
  --text-secondary: #6e6e73;
  --text-light:     #ffffff;

  /* 背景 */
  --bg-main:        #fdf0ec;
  --bg-sidebar:     rgba(174, 225, 249, 0.25);
  --bg-chat:        linear-gradient(135deg, #fdf0ec 0%, #e8f4fd 50%, #fdf0ec 100%);
  --bg-card:        rgba(255, 255, 255, 0.65);
  --bg-input:       rgba(255, 255, 255, 0.75);
  --bg-glass:       rgba(255, 255, 255, 0.45);

  /* 圆角 & 阴影 */
  --radius-sm:      12px;
  --radius-md:      18px;
  --radius-lg:      24px;
  --radius-xl:      32px;
  --shadow-sm:      0 2px 8px rgba(0,0,0,0.06);
  --shadow-md:      0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg:      0 8px 40px rgba(0,0,0,0.12);
  --shadow-glow:    0 0 30px rgba(174,225,249,0.4);

  /* 动画 */
  --transition:     0.35s cubic-bezier(0.4, 0, 0.2, 1);

  /* 布局 */
  --sidebar-width:  300px;
  --header-height:  64px;
  --input-height:   60px;

  /* 字体 */
  --font-main:      -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
  --font-mono:      "SF Mono", "Fira Code", monospace;

  /* 光标 */
  --cursor-size:    56px;
}

/* ============================================
   1. Reset & Base
   ============================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: var(--font-main);
  color: var(--text-primary);
  background: var(--bg-chat);
  min-height: 100vh;
  overflow: hidden;
  cursor: none; /* 隐藏原生光标 */
}

/* 选中颜色 */
::selection {
  background: var(--secondary);
  color: var(--text-primary);
}

/* 滚动条 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--secondary-dark);
  border-radius: 3px;
}

/* ============================================
   2. Apple 风格透明虚拟悬浮光标
   ============================================ */
#virtual-cursor {
  position: fixed;
  width: var(--cursor-size);
  height: var(--cursor-size);
  pointer-events: none;
  z-index: 100000;
  transform: translate(-50%, -50%);
  transition: width 0.3s ease, height 0.3s ease, opacity 0.3s ease;
}

#cursor-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(174, 225, 249, 0.6);
  background: radial-gradient(circle,
    rgba(253, 240, 236, 0.25) 0%,
    rgba(174, 225, 249, 0.15) 50%,
    transparent 70%
  );
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  animation: cursorPulse 3s ease-in-out infinite;
  transition: all 0.3s ease;
}

#cursor-dot {
  position: absolute;
  top: 50%; left: 50%;
  width: 6px; height: 6px;
  background: var(--secondary-dark);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 10px rgba(174,225,249,0.8);
  transition: all 0.2s ease;
}

#cursor-trail {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(174,225,249,0.08) 0%, transparent 70%);
  animation: trailGlow 2s ease-in-out infinite alternate;
}

/* 光标状态 */
#virtual-cursor.clicking #cursor-ring {
  transform: scale(0.8);
  border-color: var(--accent);
  background: radial-gradient(circle, rgba(248,164,184,0.3) 0%, transparent 70%);
}

#virtual-cursor.hovering {
  width: 72px; height: 72px;
}

#virtual-cursor.hovering #cursor-ring {
  border-color: var(--accent);
  border-width: 2.5px;
}

#virtual-cursor.hovering #cursor-dot {
  width: 10px; height: 10px;
  background: var(--accent);
}

#virtual-cursor.text-cursor {
  width: 4px; height: 28px;
}

#virtual-cursor.text-cursor #cursor-ring {
  border-radius: 2px;
  border: none;
  background: var(--secondary-dark);
  animation: textBlink 1s step-end infinite;
}

#virtual-cursor.text-cursor #cursor-dot,
#virtual-cursor.text-cursor #cursor-trail { display: none; }

@keyframes cursorPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.05); opacity: 0.85; }
}

@keyframes trailGlow {
  0% { opacity: 0.5; transform: scale(1); }
  100% { opacity: 1; transform: scale(1.15); }
}

@keyframes textBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ============================================
   3. 主布局
   ============================================ */
#app {
  display: flex;
  height: 100vh;
  width: 100vw;
  transition: var(--transition);
}

/* ── 侧边栏 ── */
#sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--bg-sidebar);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border-right: 1px solid rgba(174,225,249,0.3);
  display: flex;
  flex-direction: column;
  transition: var(--transition);
  z-index: 20;
}

#sidebar.collapsed {
  min-width: 0;
  width: 0;
  overflow: hidden;
  border: none;
}

.sidebar-header {
  height: var(--header-height);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  border-bottom: 1px solid rgba(174,225,249,0.2);
}

.sidebar-header .logo {
  font-size: 24px;
}

.sidebar-header h2 {
  font-size: 17px;
  font-weight: 600;
  background: linear-gradient(135deg, var(--accent), var(--secondary-dark));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* 搜索框 */
.search-box {
  margin: 16px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 10px 14px 10px 38px;
  border: 1px solid rgba(174,225,249,0.3);
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  backdrop-filter: blur(10px);
  font-size: 14px;
  color: var(--text-primary);
  outline: none;
  transition: var(--transition);
  font-family: var(--font-main);
}

.search-box input:focus {
  border-color: var(--secondary-dark);
  box-shadow: 0 0 0 3px rgba(174,225,249,0.2);
}

.search-box .search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  opacity: 0.5;
}

/* 角色列表 */
.char-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
}

.char-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: none;
  transition: var(--transition);
  margin-bottom: 4px;
}

.char-item:hover {
  background: rgba(174,225,249,0.2);
}

.char-item.active {
  background: rgba(174,225,249,0.35);
  box-shadow: var(--shadow-sm);
}

.char-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}

.char-info h4 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 2px;
}

.char-info p {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
}

/* 新角色按钮 */
.new-char-btn {
  margin: 12px 16px;
  padding: 12px;
  border: 2px dashed rgba(174,225,249,0.4);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-secondary);
  font-size: 14px;
  cursor: none;
  transition: var(--transition);
  font-family: var(--font-main);
}

.new-char-btn:hover {
  border-color: var(--secondary-dark);
  color: var(--secondary-dark);
  background: rgba(174,225,249,0.1);
}

/* ── 主区域 ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* 顶部栏 */
#top-bar {
  height: var(--header-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--bg-glass);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-bottom: 1px solid rgba(174,225,249,0.2);
  z-index: 10;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.toggle-sidebar-btn {
  width: 36px; height: 36px;
  border: none;
  border-radius: var(--radius-sm);
  background: rgba(174,225,249,0.2);
  font-size: 18px;
  cursor: none;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.toggle-sidebar-btn:hover {
  background: rgba(174,225,249,0.4);
}

.current-char-name {
  font-size: 16px;
  font-weight: 600;
}

.connection-status {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #ccc;
  transition: var(--transition);
}

.status-dot.connected { background: #34c759; box-shadow: 0 0 8px rgba(52,199,89,0.5); }
.status-dot.error { background: #ff3b30; }

.top-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-btn {
  width: 36px; height: 36px;
  border: none;
  border-radius: 50%;
  background: rgba(174,225,249,0.15);
  font-size: 16px;
  cursor: none;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-btn:hover {
  background: rgba(174,225,249,0.35);
  transform: scale(1.05);
}

/* ── 聊天区域 ── */
#chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.message {
  display: flex;
  gap: 12px;
  max-width: 85%;
  animation: msgSlideIn 0.4s ease-out;
}

@keyframes msgSlideIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.message.ai { align-self: flex-start; }
.message.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.message.ai .msg-avatar {
  background: linear-gradient(135deg, var(--secondary), var(--accent-alt));
  box-shadow: 0 2px 12px rgba(174,225,249,0.3);
}

.message.user .msg-avatar {
  background: linear-gradient(135deg, var(--accent), var(--primary-dark));
  box-shadow: 0 2px 12px rgba(248,164,184,0.3);
}

.msg-bubble {
  padding: 14px 18px;
  border-radius: var(--radius-md);
  font-size: 14.5px;
  line-height: 1.65;
  position: relative;
}

.message.ai .msg-bubble {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(174,225,249,0.2);
  border-top-left-radius: 4px;
  box-shadow: var(--shadow-sm);
}

.message.user .msg-bubble {
  background: linear-gradient(135deg, var(--secondary), rgba(174,225,249,0.7));
  color: var(--text-primary);
  border-top-right-radius: 4px;
  box-shadow: var(--shadow-md);
}

.msg-time {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 6px;
  opacity: 0.7;
}

/* 打字指示器 */
.typing-indicator {
  display: flex;
  gap: 5px;
  padding: 8px 4px;
}

.typing-indicator span {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--secondary-dark);
  animation: typingBounce 1.4s infinite ease-in-out;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* ── 输入区域 ── */
#input-area {
  padding: 16px 20px 24px;
  background: var(--bg-glass);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-top: 1px solid rgba(174,225,249,0.15);
}

.input-wrapper {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  background: var(--bg-input);
  border: 1px solid rgba(174,225,249,0.3);
  border-radius: var(--radius-lg);
  padding: 8px 8px 8px 18px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}

.input-wrapper:focus-within {
  border-color: var(--secondary-dark);
  box-shadow: 0 0 0 4px rgba(174,225,249,0.15), var(--shadow-md);
}

.input-wrapper textarea {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 15px;
  font-family: var(--font-main);
  color: var(--text-primary);
  resize: none;
  outline: none;
  max-height: 120px;
  padding: 8px 0;
  line-height: 1.5;
}

.input-wrapper textarea::placeholder {
  color: var(--text-secondary);
  opacity: 0.6;
}

.send-btn {
  width: 44px; height: 44px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--secondary-dark), var(--accent));
  color: white;
  font-size: 18px;
  cursor: none;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.send-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 4px 16px rgba(174,225,249,0.4);
}

.send-btn:active {
  transform: scale(0.95);
}

/* ============================================
   4. 悬浮光标 — API 配置面板
   ============================================ */
#cursor-config-trigger {
  position: fixed;
  bottom: 100px;
  right: 30px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(174,225,249,0.5), rgba(253,240,236,0.5));
  backdrop-filter: blur(20px) saturate(200%);
  -webkit-backdrop-filter: blur(20px) saturate(200%);
  border: 1.5px solid rgba(174,225,249,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  cursor: none;
  z-index: 9000;
  box-shadow: var(--shadow-md), var(--shadow-glow);
  transition: var(--transition);
  animation: floatBob 4s ease-in-out infinite;
}

#cursor-config-trigger:hover {
  transform: scale(1.1);
  box-shadow: var(--shadow-lg), 0 0 40px rgba(174,225,249,0.6);
}

@keyframes floatBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* ── API 配置面板 ── */
#api-panel {
  position: fixed;
  bottom: 170px;
  right: 30px;
  width: 380px;
  max-height: 70vh;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(50px) saturate(200%);
  -webkit-backdrop-filter: blur(50px) saturate(200%);
  border-radius: var(--radius-lg);
  border: 1px solid rgba(174,225,249,0.3);
  box-shadow: var(--shadow-lg), 0 0 60px rgba(174,225,249,0.15);
  z-index: 9500;
  overflow: hidden;
  transform-origin: bottom right;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0;
  transform: scale(0.9) translateY(20px);
  pointer-events: none;
}

#api-panel.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: auto;
}

.panel-header {
  padding: 18px 22px;
  border-bottom: 1px solid rgba(174,225,249,0.2);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.panel-header h3 {
  font-size: 16px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--secondary-dark), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.panel-close {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: none;
  background: rgba(174,225,249,0.2);
  font-size: 14px;
  cursor: none;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.panel-close:hover { background: rgba(248,164,184,0.3); }

.panel-body {
  padding: 18px 22px;
  overflow-y: auto;
  max-height: calc(70vh - 60px);
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group select,
.form-group input[type="text"],
.form-group input[type="password"],
.form-group input[type="number"] {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid rgba(174,225,249,0.3);
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  backdrop-filter: blur(10px);
  font-size: 14px;
  font-family: var(--font-main);
  color: var(--text-primary);
  outline: none;
  transition: var(--transition);
  cursor: none;
}

.form-group select:focus,
.form-group input:focus {
  border-color: var(--secondary-dark);
  box-shadow: 0 0 0 3px rgba(174,225,249,0.15);
}

.form-group input[type="password"] {
  font-family: var(--font-mono);
  letter-spacing: 2px;
}

.form-row {
  display: flex;
  gap: 12px;
}

.form-row .form-group { flex: 1; }

.slider-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.slider-group input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(to right, var(--secondary), var(--accent));
  outline: none;
  cursor: none;
}

.slider-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: white;
  border: 2px solid var(--secondary-dark);
  box-shadow: var(--shadow-sm);
  cursor: none;
}

.slider-value {
  font-size: 13px;
  font-weight: 600;
  color: var(--secondary-dark);
  min-width: 36px;
  text-align: right;
  font-family: var(--font-mono);
}

/* 按钮组 */
.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

.btn-primary {
  flex: 1;
  padding: 11px;
  border: none;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--secondary-dark), var(--accent));
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: none;
  transition: var(--transition);
  font-family: var(--font-main);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.btn-secondary {
  flex: 1;
  padding: 11px;
  border: 1.5px solid rgba(174,225,249,0.4);
  border-radius: var(--radius-sm);
  background: var(--bg-glass);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  cursor: none;
  transition: var(--transition);
  font-family: var(--font-main);
}

.btn-secondary:hover {
  border-color: var(--secondary-dark);
  background: rgba(174,225,249,0.15);
}

/* ── AI 一键美化面板 ── */
.ai-theme-section {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid rgba(174,225,249,0.2);
}

.ai-theme-section h4 {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.theme-presets {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.theme-preset-btn {
  padding: 12px 10px;
  border: 1.5px solid rgba(174,225,249,0.25);
  border-radius: var(--radius-sm);
  background: var(--bg-glass);
  cursor: none;
  transition: var(--transition);
  text-align: center;
  font-family: var(--font-main);
}

.theme-preset-btn:hover {
  border-color: var(--secondary-dark);
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}

.theme-preset-btn .theme-icon { font-size: 24px; margin-bottom: 6px; }
.theme-preset-btn .theme-name { font-size: 12px; font-weight: 600; color: var(--text-primary); }

.theme-preset-btn .theme-colors {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-top: 6px;
}

.theme-preset-btn .color-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.1);
}

.ai-generate-btn {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 2px dashed rgba(174,225,249,0.4);
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, rgba(174,225,249,0.1), rgba(248,164,184,0.1));
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  cursor: none;
  transition: var(--transition);
  font-family: var(--font-main);
}

.ai-generate-btn:hover {
  border-color: var(--accent);
  background: linear-gradient(135deg, rgba(174,225,249,0.2), rgba(248,164,184,0.2));
  transform: translateY(-2px);
}

/* ============================================
   5. 通知 / Toast
   ============================================ */
#toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toast {
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(174,225,249,0.3);
  box-shadow: var(--shadow-md);
  font-size: 14px;
  animation: toastIn 0.4s ease-out;
  max-width: 320px;
}

.toast.success { border-left: 4px solid #34c759; }
.toast.error   { border-left: 4px solid #ff3b30; }
.toast.info    { border-left: 4px solid var(--secondary-dark); }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(40px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ============================================
   6. 背景装饰
   ============================================ */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.3;
  pointer-events: none;
  z-index: 0;
  animation: orbFloat 20s ease-in-out infinite;
}

.bg-orb-1 { width: 400px; height: 400px; background: var(--secondary); top: -100px; right: -100px; }
.bg-orb-2 { width: 300px; height: 300px; background: var(--accent);    bottom: -80px; left: -80px; animation-delay: -7s; }
.bg-orb-3 { width: 250px; height: 250px; background: var(--accent-alt); top: 50%; left: 50%; animation-delay: -14s; }

@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%      { transform: translate(30px, -30px) scale(1.1); }
  66%      { transform: translate(-20px, 20px) scale(0.95); }
}

/* ============================================
   7. 响应式
   ============================================ */
@media (max-width: 768px) {
  :root { --sidebar-width: 280px; }

  #sidebar {
    position: fixed;
    left: 0; top: 0;
    height: 100vh;
    z-index: 100;
    transform: translateX(-100%);
  }

  #sidebar:not(.collapsed) {
    transform: translateX(0);
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(4px);
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: var(--transition);
  }

  .sidebar-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .message { max-width: 92%; }

  #api-panel {
    right: 10px;
    left: 10px;
    width: auto;
    bottom: 100px;
  }

  #cursor-config-trigger {
    right: 16px;
    bottom: 90px;
    width: 50px; height: 50px;
  }
}
</style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<!-- Apple 风格虚拟光标 -->
<div id="virtual-cursor">
  <div id="cursor-trail"></div>
  <div id="cursor-ring"></div>
  <div id="cursor-dot"></div>
</div>

<!-- 通知容器 -->
<div id="toast-container"></div>

<!-- 移动端侧边栏遮罩 -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ===== 主应用 ===== -->
<div id="app">

  <!-- ── 侧边栏 ── -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="logo">🍺</span>
      <h2>AI 酒馆</h2>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>

      <!-- 动态生成 -->
    </div>

    <button class="new-char-btn" onclick="showToast('🚧 角色编辑器开发中…', 'info')">
      ＋ 创建新角色
    </button>
  </aside>

  <!-- ── 主区域 ── -->
  <main id="main">
    <!-- 顶部栏 -->
    <header id="top-bar">
      <div class="top-left">
        <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="切换侧边栏">☰</button>
        <div>

                  oninput="autoResize(this)"></textarea>

</div>

<!-- ===== 悬浮触发按钮 ===== -->
<button id="cursor-config-trigger" onclick="togglePanel()">✦</button>

<!-- ===== API 配置面板 ===== -->
<div id="api-panel">
  <div class="panel-header">
    <h3>✦ API 连接 & 主题</h3>
    <button class="panel-close" onclick="togglePanel()">✕</button>
  </div>
  <div class="panel-body">
    <!-- API 配置 -->
    <div class="form-group">
      <label>API 提供商</label>
      <select id="apiProvider" onchange="onProviderChange()">
        <option value="openai">OpenAI (ChatGPT)</option>
        <option value="claude">Anthropic (Claude)</option>
        <option value="gemini">Google (Gemini)</option>
        <option value="deepseek">DeepSeek</option>
        <option value="ollama">Ollama (本地)</option>
        <option value="custom">自定义 API</option>
      </select>
    </div>

    <div class="form-group">
      <label>API 地址</label>
      <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions">
    </div>

    <div class="form-group">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="sk-...">
    </div>

    <div class="form-group">
      <label>模型</label>
      <input type="text" id="modelName" placeholder="gpt-4o / claude-sonnet-4-20250514 / ...">

    <div class="form-row">
      <div class="form-group">
        <label>Temperature</label>

                 oninput="document.getElementById('tempVal').textContent = (this.value/100).toFixed(2)">

    <div class="form-group">

      <input type="text" id="systemPrompt" placeholder="你是一个有趣的AI助手…" 
             value="你是「小雪」，一个温柔可爱的AI酒馆助手。请用生动有趣的方式回答。">
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="connectAPI()">🔗 连接</button>
      <button class="btn-secondary" onclick="testConnection()">📡 测试</button>
    </div>

    <!-- AI 一键美化 -->
    <div class="ai-theme-section">
      <h4>🎨 AI 一键美化</h4>

      <div class="theme-presets">
        <button class="theme-preset-btn" onclick="applyTheme('sakura')">
          <div class="theme-icon">🌸</div>
          <div class="theme-name">樱花粉</div>
          <div class="theme-colors">
            <span class="color-dot" style="background:#fdf0ec"></span>
            <span class="color-dot" style="background:#f8a4b8"></span>
            <span class="color-dot" style="background:#fcc"></span>
          </div>
        </button>
        <button class="theme-preset-btn" onclick="applyTheme('ocean')">
          <div class="theme-icon">🌊</div>
          <div class="theme-name">深海蓝</div>
          <div class="theme-colors">
            <span class="color-dot" style="background:#0a1628"></span>
            <span class="color-dot" style="background:#1e90ff"></span>
            <span class="color-dot" style="background:#00c8ff"></span>
          </div>
        </button>
        <button class="theme-preset-btn" onclick="applyTheme('forest')">
          <div class="theme-icon">🌿</div>
          <div class="theme-name">森林绿</div>
          <div class="theme-colors">
            <span class="color-dot" style="background:#f0f5e9"></span>
            <span class="color-dot" style="background:#6dbf73"></span>
            <span class="color-dot" style="background:#2d6a4f"></span>
          </div>
        </button>
        <button class="theme-preset-btn" onclick="applyTheme('midnight')">
          <div class="theme-icon">🌙</div>
          <div class="theme-name">午夜黑</div>
          <div class="theme-colors">
            <span class="color-dot" style="background:#1a1a2e"></span>
            <span class="color-dot" style="background:#e94560"></span>
            <span class="color-dot" style="background:#533483"></span>
          </div>
        </button>
      </div>

      <button class="ai-generate-btn" onclick="aiGenerateTheme()">
        ✨ 让 AI 生成专属主题
      </button>
    </div>
  </div>
</div>

<script>
// ============================================
// 状态管理
// ============================================
const state = {
  sidebarOpen: window.innerWidth > 768,
  panelOpen: false,
  connected: false,
  apiConfig: {
    provider: 'openai',
    url: '',
    key: '',
    model: '',
    temperature: 0.7,
    maxTokens: 2048,
    systemPrompt: '你是「小雪」，一个温柔可爱的AI酒馆助手。请用生动有趣的方式回答。'
  },
  messages: [],
  characters: [
    { id: 1, name: '小雪', emoji: '❄️', desc: '温柔可爱的AI酒馆助手', greeting: '欢迎来到 AI 酒馆~ 我是小雪，今天想聊些什么呢？🍵' },
    { id: 2, name: '剑客·风', emoji: '⚔️', desc: '江湖上的传奇剑客',   greeting: '…风起云涌，江湖再会。你找我有何事？' },
    { id: 3, name: 'Nova', emoji: '🤖', desc: '来自未来的AI研究员',    greeting: 'Connection established. I am Nova, temporal research unit. How may I assist?' },
    { id: 4, name: '猫猫酱', emoji: '🐱', desc: '超可爱的猫娘角色',     greeting: '喵~！主人来啦！猫猫酱好想你呀~ 今天要一起玩什么呢喵？✨' },
    { id: 5, name: '博士', emoji: '🧪', desc: '全能型知识助手',         greeting: '你好，我是博士。无论是科学、文学还是哲学，都可以来找我探讨。' },
  ],
  currentChar: null,
  isTyping: false
};

// ============================================
// 虚拟光标 (Apple 风格)
// ============================================
const cursor = document.getElementById('virtual-cursor');
let cursorX = 0, cursorY = 0;
let targetX = 0, targetY = 0;

document.addEventListener('mousemove', (e) => {
  targetX = e.clientX;
  targetY = e.clientY;
});

document.addEventListener('mousedown', () => cursor.classList.add('clicking'));
document.addEventListener('mouseup', () => cursor.classList.remove('clicking'));

// 检测可交互元素
document.addEventListener('mouseover', (e) => {
  const el = e.target;
  const interactive = el.closest('button, a, select, .char-item, .theme-preset-btn, .ai-generate-btn, .new-char-btn, .icon-btn, .send-btn, .toggle-sidebar-btn, .panel-close, #cursor-config-trigger');
  const textInput = el.closest('input, textarea');
  
  cursor.classList.remove('hovering', 'text-cursor');
  
  if (interactive) {
    cursor.classList.add('hovering');
  } else if (textInput) {
    cursor.classList.add('text-cursor');
  }
});

// 平滑跟随动画
function animateCursor() {
  const ease = 0.15;
  cursorX += (targetX - cursorX) * ease;
  cursorY += (targetY - cursorY) * ease;
  cursor.style.left = cursorX + 'px';
  cursor.style.top = cursorY + 'px';
  requestAnimationFrame(animateCursor);
}
animateCursor();

// 触摸设备隐藏虚拟光标
if ('ontouchstart' in window) {
  cursor.style.display = 'none';
  document.body.style.cursor = 'auto';
}

// ============================================
// 侧边栏
// ============================================
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  state.sidebarOpen = !state.sidebarOpen;

  if (window.innerWidth <= 768) {
    sb.classList.toggle('collapsed', !state.sidebarOpen);
    overlay.classList.toggle('visible', state.sidebarOpen);
  } else {
    sb.classList.toggle('collapsed');
  }
}

document.getElementById('sidebarOverlay').addEventListener('click', () => {
  state.sidebarOpen = false;
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('sidebarOverlay').classList.remove('visible');
});

// ============================================
// 角色列表
// ============================================
function renderCharacters(filter = '') {
  const list = document.getElementById('charList');
  const filtered = state.characters.filter(c =>
    c.name.includes(filter) || c.desc.includes(filter)
  );

  list.innerHTML = filtered.map(c => `
    <div class="char-item ${state.currentChar?.id === c.id ? 'active' : ''}" 
         onclick="selectCharacter(${c.id})">
      <div class="char-avatar">${c.emoji}</div>
      <div class="char-info">
        <h4>${c.name}</h4>
        <p>${c.desc}</p>
      </div>
    </div>
  `).join('');
}

function selectCharacter(id) {
  const char = state.characters.find(c => c.id === id);
  if (!char) return;

  state.currentChar = char;
  state.messages = [];
  document.getElementById('currentCharName').textContent = char.name;
  renderCharacters();

  // 展示问候语
  addMessage('ai', char.greeting);

  // 移动端关闭侧边栏
  if (window.innerWidth <= 768) {
    toggleSidebar();
  }
}

document.getElementById('charSearch').addEventListener('input', (e) => {
  renderCharacters(e.target.value);
});

// ============================================
// 聊天系统
// ============================================
function addMessage(role, content) {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('zh-Hans', { hour: '2-digit', minute: '2-digit' });

  state.messages.push({ role, content, time: timeStr });
  renderMessages();
}

function renderMessages() {
  const area = document.getElementById('chat-area');
  const char = state.currentChar;

  area.innerHTML = state.messages.map(msg => `
    <div class="message ${msg.role === 'ai' ? 'ai' : 'user'}">
      <div class="msg-avatar">
        ${msg.role === 'ai' ? (char?.emoji || '🤖') : '👤'}
      </div>
      <div>
        <div class="msg-bubble">${formatContent(msg.content)}</div>
        <div class="msg-time">${msg.time}</div>
      </div>
    </div>
  `).join('');

  // 打字指示器
  if (state.isTyping) {
    area.innerHTML += `
      <div class="message ai">
        <div class="msg-avatar">${char?.emoji || '🤖'}</div>
        <div>
          <div class="msg-bubble">
            <div class="typing-indicator">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  area.scrollTop = area.scrollHeight;
}

function formatContent(text) {
  // 简易 Markdown
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code style="background:rgba(174,225,249,0.2);padding:2px 6px;border-radius:4px;font-family:var(--font-mono);font-size:13px">$1</code>')
    .replace(/\n/g, '<br>');
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);

  // 如果已连接 API，则请求
  if (state.connected) {
    await callAPI(text);
  } else {
    // 本地模拟回复
    state.isTyping = true;
    renderMessages();

    await sleep(800 + Math.random() * 1200);

    state.isTyping = false;
    const replies = [
      `嗯嗯，你说的"${text.slice(0, 15)}…"很有意思呢！不过我现在还没连接到 API 哦~ 点击右下角 ✦ 按钮来配置连接吧！ 😊`,
      `收到啦！不过要完整发挥我的能力，需要先连接 API 呢。试试点击 ✦ 悬浮按钮进行设置？ 🔧`,
      `有趣的话题！💡 连接 API 后我就能给你更精彩的回复了~\n提示：右下角 ✦ → 配置 API → 点击连接`,
    ];
    addMessage('ai', replies[Math.floor(Math.random() * replies.length)]);
  }
}

async function callAPI(userMessage) {
  state.isTyping = true;
  renderMessages();

  const { url, key, model, temperature, maxTokens, systemPrompt } = state.apiConfig;

  // 构建消息历史
  const apiMessages = [
    { role: 'system', content: systemPrompt }
  ];

  state.messages.forEach(msg => {
    if (msg.role === 'ai') {
      apiMessages.push({ role: 'assistant', content: msg.content });
    } else {
      apiMessages.push({ role: 'user', content: msg.content });
    }
  });

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: model,
        messages: apiMessages,
        temperature: temperature,
        max_tokens: maxTokens,
        stream: false
      })
    });

    if (!response.ok) {
      throw new Error(`API 错误: ${response.status} ${response.statusText}`);
    }

    const data = await response.json();

    state.isTyping = false;

    // 兼容不同 API 格式
    let reply = '';
    if (data.choices?.[0]?.message?.content) {
      reply = data.choices[0].message.content;
    } else if (data.content?.[0]?.text) {
      reply = data.content[0].text;
    } else if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
      reply = data.candidates[0].content.parts[0].text;
    } else {
      reply = JSON.stringify(data);
    }

    addMessage('ai', reply);

    // 检查 AI 回复中是否包含主题指令
    checkThemeCommand(reply);

  } catch (err) {
    state.isTyping = false;
    addMessage('ai', `❌ 请求出错：${err.message}\n\n请检查 API 配置是否正确。`);
    showToast(`API 错误: ${err.message}`, 'error');
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// Enter 发送, Shift+Enter 换行
document.getElementById('userInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function clearChat() {
  state.messages = [];
  renderMessages();
  showToast('聊天已清空', 'info');
}

function exportChat() {
  const text = state.messages.map(m => `[${m.time}] ${m.role === 'ai' ? (state.currentChar?.name || 'AI') : '你'}: ${m.content}`).join('\n\n');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `chat_${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('聊天记录已导出 📄', 'success');
}

// ============================================
// API 配置面板
// ============================================
function togglePanel() {
  const panel = document.getElementById('api-panel');
  state.panelOpen = !state.panelOpen;
  panel.classList.toggle('visible', state.panelOpen);
}

function onProviderChange() {
  const provider = document.getElementById('apiProvider').value;
  const urlInput = document.getElementById('apiUrl');
  const modelInput = document.getElementById('modelName');

  const presets = {
    openai:   { url: 'https://api.openai.com/v1/chat/completions', model: 'gpt-4o' },
    claude:   { url: 'https://api.anthropic.com/v1/messages',      model: 'claude-sonnet-4-20250514' },
    gemini:   { url: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent', model: 'gemini-pro' },
    deepseek: { url: 'https://api.deepseek.com/v1/chat/completions', model: 'deepseek-chat' },
    ollama:   { url: 'http://localhost:11434/api/chat',              model: 'llama3' },
    custom:   { url: '', model: '' }
  };

  if (presets[provider]) {
    urlInput.value = presets[provider].url;
    modelInput.value = presets[provider].model;
  }
}

function connectAPI() {
  const config = {
    provider: document.getElementById('apiProvider').value,
    url: document.getElementById('apiUrl').value.trim(),
    key: document.getElementById('apiKey').value.trim(),
    model: document.getElementById('modelName').value.trim(),
    temperature: parseInt(document.getElementById('temperature').value) / 100,
    maxTokens: parseInt(document.getElementById('maxTokens').value),
    systemPrompt: document.getElementById('systemPrompt').value.trim()
  };

  if (!config.url) {
    showToast('请填写 API 地址', 'error');
    return;
  }

  state.apiConfig = config;
  state.connected = true;

  document.getElementById('statusDot').className = 'status-dot connected';
  document.getElementById('statusText').textContent = `已连接 · ${config.model}`;

  showToast(`✅ 已连接到 ${config.provider.toUpperCase()} · ${config.model}`, 'success');
  togglePanel();

  // 保存到 localStorage
  localStorage.setItem('tavern_api_config', JSON.stringify(config));
}

async function testConnection() {
  const url = document.getElementById('apiUrl').value.trim();
  const key = document.getElementById('apiKey').value.trim();
  const model = document.getElementById('modelName').value.trim();

  if (!url || !key) {
    showToast('请填写 API 地址和 Key', 'error');
    return;
  }

  showToast('📡 正在测试连接…', 'info');

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: model,
        messages: [{ role: 'user', content: 'Hi' }],
        max_tokens: 5
      })
    });

    if (response.ok) {
      showToast('✅ 连接成功！API 正常工作', 'success');
    } else {
      const err = await response.text();
      showToast(`❌ 连接失败: ${response.status} - ${err.slice(0, 100)}`, 'error');
    }
  } catch (e) {
    showToast(`❌ 连接失败: ${e.message}`, 'error');
  }
}

// 加载保存的配置
function loadSavedConfig() {
  const saved = localStorage.getItem('tavern_api_config');
  if (saved) {
    try {
      const config = JSON.parse(saved);
      state.apiConfig = config;
      document.getElementById('apiProvider').value = config.provider;
      document.getElementById('apiUrl').value = config.url;
      document.getElementById('apiKey').value = config.key;
      document.getElementById('modelName').value = config.model;
      document.getElementById('temperature').value = config.temperature * 100;
      document.getElementById('tempVal').textContent = config.temperature.toFixed(2);
      document.getElementById('maxTokens').value = config.maxTokens;
      document.getElementById('systemPrompt').value = config.systemPrompt;
    } catch(e) {}
  }
}

function applyTheme(name) {
  const theme = themes[name];
  if (!theme) return;

  const root = document.documentElement;
  const oldValues = {};

  // 记录旧值用于动画
  Object.keys(theme).forEach(key => {
    oldValues[key] = getComputedStyle(root).getPropertyValue(key);
  });

  // 应用新主题
  Object.entries(theme).forEach(([key, value]) => {
    root.style.setProperty(key, value);
  });

  // 更新背景渐变
  if (theme['--bg-chat']) {
    document.body.style.background = theme['--bg-chat'];
  }

  // 保存主题选择
  localStorage.setItem('tavern_theme', name);

  showToast(`🎨 主题已切换: ${name.toUpperCase()}`, 'success');

  // 添加切换动画
  document.body.style.transition = 'background 0.8s ease';
  setTimeout(() => { document.body.style.transition = ''; }, 1000);
}

// AI 生成主题
async function aiGenerateTheme() {
  if (!state.connected) {
    showToast('请先连接 API 才能使用 AI 生成主题', 'error');
    return;
  }

  showToast('🎨 AI 正在生成专属主题…', 'info');

  const themePrompt = `请为一个聊天应用生成一个独特的配色方案。返回一个JSON对象，格式如下（不要包含任何其他文字）：
{
  "name": "主题名称",
  "primary": "#hex",
  "secondary": "#hex",
  "primaryDark": "#hex",
  "secondaryDark": "#hex",
  "accent": "#hex",
  "accentAlt": "#hex",
  "textPrimary": "#hex",
  "textSecondary": "#hex",
  "isDark": false
}
请确保颜色搭配和谐美观，有创意。只返回JSON。`;

  try {
    const response = await fetch(state.apiConfig.url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${state.apiConfig.key}`
      },
      body: JSON.stringify({
        model: state.apiConfig.model,
        messages: [{ role: 'user', content: themePrompt }],
        temperature: 1.0,
        max_tokens: 300
      })
    });

    const data = await response.json();

    let reply = '';
    if (data.choices?.[0]?.message?.content) reply = data.choices[0].message.content;
    else if (data.content?.[0]?.text) reply = data.content[0].text;

    // 提取 JSON
    const jsonMatch = reply.match(/\{[\s\S]*\}/);
    if (jsonMatch) {
      const themeData = JSON.parse(jsonMatch[0]);

      const isDark = themeData.isDark;
      const bgMain = isDark ? themeData.primary : themeData.primary;

      const generatedTheme = {
        '--primary': themeData.primary,
        '--secondary': themeData.secondary,
        '--primary-dark': themeData.primaryDark,
        '--secondary-dark': themeData.secondaryDark,
        '--accent': themeData.accent,
        '--accent-alt': themeData.accentAlt,
        '--text-primary': themeData.textPrimary,
        '--text-secondary': themeData.textSecondary,
        '--text-light': '#ffffff',
        '--bg-main': bgMain,
        '--bg-sidebar': `rgba(${hexToRgb(themeData.secondary)}, 0.15)`,
        '--bg-chat': `linear-gradient(135deg, ${themeData.primary} 0%, ${themeData.primaryDark} 50%, ${themeData.primary} 100%)`,
        '--bg-card': isDark ? `rgba(${hexToRgb(themeData.primaryDark)}, 0.8)` : 'rgba(255,255,255,0.65)',
        '--bg-input': isDark ? `rgba(${hexToRgb(themeData.primaryDark)}, 0.8)` : 'rgba(255,255,255,0.75)',
        '--bg-glass': isDark ? `rgba(${hexToRgb(themeData.primary)}, 0.6)` : 'rgba(255,255,255,0.45)',
      };

      themes['ai-generated'] = generatedTheme;
      applyTheme('ai-generated');
      showToast(`✨ AI 生成主题「${themeData.name || 'Custom'}」已应用！`, 'success');
    } else {
      showToast('AI 返回格式异常，请重试', 'error');
    }

  } catch (err) {
    showToast(`主题生成失败: ${err.message}`, 'error');
  }
}

// 检查 AI 回复中的主题指令
function checkThemeCommand(reply) {
  const lower = reply.toLowerCase();
  if (lower.includes('[theme:')) {
    const match = reply.match(/\[theme:(\w+)\]/);
    if (match && themes[match[1]]) {
      applyTheme(match[1]);
    }
  }
}

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result
    ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}`
    : '128, 128, 128';
}

// ============================================
// Toast 通知
// ============================================
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.transition = '0.3s ease';
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(40px)';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

// ============================================
// 工具
// ============================================
function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// ============================================
// 初始化
// ============================================
function init() {
  // 加载配置
  loadSavedConfig();

  // 加载主题
  const savedTheme = localStorage.getItem('tavern_theme');
  if (savedTheme && themes[savedTheme]) {
    applyTheme(savedTheme);
  }

  // 渲染角色列表
  renderCharacters();

  // 默认选择第一个角色
  selectCharacter(1);

  // 初始化 provider
  onProviderChange();

  // 移动端默认收起侧边栏
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.add('collapsed');
    state.sidebarOpen = false;
  }
}

init();
